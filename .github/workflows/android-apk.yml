name: Build Android APK
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - name: Build the web version (pygbag) and make it a phone web app
        run: |
          pip install pygbag
          pygbag --build .
          python tools/make_mobile_web.py
      - name: Wrap it in an Android project (Capacitor)
        working-directory: mobile/android
        run: |
          npm install
          rm -rf www && cp -r ../../build/web www
          npx cap add android
          python patch_android.py
          npx cap sync android
      - name: Build debug APK
        working-directory: mobile/android/android
        run: ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: protect-the-didit-apk
          path: mobile/android/android/app/build/outputs/apk/debug/app-debug.apk
